name: daily

# One video a day: plan, media, narration, render, SEO, thumbnail, upload.
#
# Ported from yt-factory's workflow, which has been through real failures, with the parts that
# differ for this channel:
#
#   - nothing here calls a language model. The plan reads three catalogues (clips, facts,
#     sounds), each checked once when it was added, so the only thing a run can spend from the
#     free Cloudflare allowance is drawing a card that has no footage.
#   - made for kids: pipeline/upload.py sets selfDeclaredMadeForKids = true on every upload and
#     the preflight stops the run if the config says otherwise. That is COPPA, not a preference.
#   - the runner is thrown away and output/ is not in git, so what a run produced is carried
#     over explicitly: data/kids.db is committed back after EVERY run (failed ones too), and the
#     downloaded clips, narration and drawn pictures go in the Actions cache keyed by video id.
#
# A failed run does not stop the schedule: cron fires again and carries on with the unfinished
# video (up to 3 attempts) before starting a new one.

on:
  schedule:
    # Two chances a day. GitHub starts a scheduled job when it has runners free, not when the
    # cron says, and may drop one altogether under load; yt-factory measured 2h55 to 5h44 late
    # on every scheduled run. The second cron costs nothing on a day the first delivered - the
    # guard job sees the finished video and stops - and rescues the days it did not.
    - cron: "27 2 * * *"          # 02:27 UTC, off the hour on purpose
    - cron: "53 10 * * *"         # and again, far enough after to know how the first ended
  workflow_dispatch:

concurrency:
  group: daily
  cancel-in-progress: false       # never kill a run halfway through an upload

permissions:
  contents: write                 # commit data/kids.db
  issues: write                   # the run summary is an issue comment, which is the email

jobs:
  decide:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.guard.outputs.run }}
      reason: ${{ steps.guard.outputs.reason }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - id: guard
        run: python scripts/ci_should_run.py | tee -a "$GITHUB_OUTPUT"
      - run: echo "${{ steps.guard.outputs.reason }}" >> "$GITHUB_STEP_SUMMARY"

  produce:
    needs: decide
    if: needs.decide.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
      PYTHONUNBUFFERED: "1"
      PYTHONUTF8: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Preflight (token, tools, edge-tts, clip CDN, the made-for-kids guard)
        run: python scripts/ci_preflight.py

      - name: Which video is this run working on
        id: state
        run: python scripts/ci_state.py | tee -a "$GITHUB_OUTPUT"

      - name: Restore what an earlier run of this video left behind
        uses: actions/cache/restore@v4
        with:
          path: |
            output/${{ steps.state.outputs.video_id }}/clips
            output/${{ steps.state.outputs.video_id }}/images
            output/${{ steps.state.outputs.video_id }}/sounds
            output/${{ steps.state.outputs.video_id }}/audio
          key: video-${{ steps.state.outputs.video_id }}-${{ github.run_id }}
          restore-keys: |
            video-${{ steps.state.outputs.video_id }}-

      - name: Produce and upload the video
        id: run
        continue-on-error: true   # the steps below must run either way
        run: python run.py

      - name: Save what this run produced, for the next one
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            output/${{ steps.state.outputs.video_id }}/clips
            output/${{ steps.state.outputs.video_id }}/images
            output/${{ steps.state.outputs.video_id }}/sounds
            output/${{ steps.state.outputs.video_id }}/audio
          key: video-${{ steps.state.outputs.video_id }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Keep the finished video downloadable
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ steps.state.outputs.video_id }}
          path: |
            output/${{ steps.state.outputs.video_id }}/final.mp4
            output/${{ steps.state.outputs.video_id }}/thumbnail.jpg
            output/${{ steps.state.outputs.video_id }}/thumb_small.jpg
          retention-days: 14
          if-no-files-found: warn

      - name: Commit the database back
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/kids.db
          if git diff --cached --quiet; then
            echo "database unchanged"
            exit 0
          fi
          git commit -m "State after run ${{ github.run_id }} (${{ steps.run.outcome }})"
          # The database IS the memory: which video exists, which stages finished, what is
          # scheduled on YouTube. A push lost to a race would make the next run repeat work, so
          # it is retried rather than left to chance.
          for attempt in 1 2 3 4 5; do
            git pull --rebase --autostash origin "${{ github.ref_name }}" || true
            if git push origin "HEAD:${{ github.ref_name }}"; then
              echo "database pushed on attempt $attempt"
              exit 0
            fi
            echo "push attempt $attempt failed, retrying in $((attempt * 10))s"
            sleep $((attempt * 10))
          done
          echo "::error::the database could not be pushed after 5 attempts"
          exit 1

      - name: Post the run summary (this is the email)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "${{ steps.run.outcome }}" in
            success) outcome=success ;;
            skipped|"") outcome=not-started ;;
            *) outcome=failure ;;
          esac
          python scripts/notify.py --outcome "$outcome" --owner "${{ github.repository_owner }}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" > summary.md
          cat summary.md >> "$GITHUB_STEP_SUMMARY"
          number=$(gh issue list --label run-log --state open --json number --jq '.[0].number // empty')
          if [ -z "$number" ]; then
            gh label create run-log --color 0e8a16 --description "One comment per daily run" 2>/dev/null || true
            number=$(gh issue create --title "Daily run log" --label run-log \
              --body "One comment per daily run, mentioning the owner so it arrives as an email. Safe to ignore." \
              | grep -o '[0-9]*$')
          fi
          gh issue comment "$number" --body-file summary.md

      - name: Fail the job if the run failed
        if: steps.run.outcome == 'failure'
        run: exit 1
