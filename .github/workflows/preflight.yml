name: preflight

# Only the preflight of the daily run (scripts/ci_preflight.py), by hand: the YouTube token
# loads, refreshes and is for the channel in config.json, the tools are there, edge-tts can
# speak, a catalogue clip can be fetched. Builds and uploads nothing. Used after the token or
# the channel changes, so the answer is known before the daily run spends anything.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
      PYTHONUNBUFFERED: "1"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Preflight
        run: python scripts/ci_preflight.py | tee -a "$GITHUB_STEP_SUMMARY"
